    <rect x="231" y="314" width="197" height="30" rx="15" fill="#352F26"/>
    <text x="329.5" y="334" fill="#F0C879" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">ENGINE PREVIEW</text>
