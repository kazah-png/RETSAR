<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">RETSAR — independent desktops, shared hardware</title>
  <desc id="desc">RETSAR is an open-source project for general-purpose Windows desktop workspaces. Development preview. Original identity with two separated desktop frames.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151E31"/><stop offset="1" stop-color="#0B1020"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5DE4C7"/><stop offset="1" stop-color="#79CFF2"/></linearGradient>
    <mask id="separation"><rect width="256" height="256" fill="white"/><rect x="90" y="90" width="158" height="136" rx="25" fill="black"/></mask>
  </defs>
  <rect width="1440" height="480" rx="24" fill="#0B1020"/>
  <rect x="1" y="1" width="1438" height="478" rx="23" fill="none" stroke="#253249"/>
  <path d="M56 0h1328" stroke="url(#edge)" stroke-width="3"/>
  <path d="M926 1v478" stroke="#253249"/>
  <rect x="957" y="32" width="450" height="416" rx="18" fill="url(#surface)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="64" y="70" fill="#5DE4C7" font-size="13" font-weight="600" letter-spacing="3">GENERAL-PURPOSE WINDOWS WORKSPACES</text>
    <text x="59" y="186" fill="#EFF4FC" font-size="102" font-weight="700" letter-spacing="-4">RETSAR</text>
    <text x="64" y="248" fill="#EFF4FC" font-size="30" font-weight="400">Independent desktops. Shared hardware.</text>
    <text x="64" y="301" fill="#9BADCE" font-size="18">Runtime Environment for Terminal Sharing</text>
    <text x="64" y="328" fill="#9BADCE" font-size="18">and Allocation of Resources</text>
    <rect x="64" y="382" width="165" height="32" rx="7" fill="#19342F"/>
    <text x="146.5" y="403" fill="#5DE4C7" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">OPEN SOURCE / MIT</text>
    <text x="253" y="403" fill="#9BADCE" font-size="12" font-weight="600" letter-spacing="1.5">DEVELOPMENT PREVIEW</text>
    <text x="1182" y="396" fill="#9BADCE" font-size="12" text-anchor="middle" letter-spacing="2">SPACE FOR YOUR NEXT WORKSPACE</text>
  </g>
  <g transform="translate(1054 89)">
