<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">RETSAR — engine preview</title>
  <desc id="desc">Original RETSAR identity: two outlined terminals connected to a central resource node. Native Windows multiseat remains in development.</desc>
