name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare an isolated source copy on C
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted Windows workspaces and RUNNER_TEMP may be on D:.
          # Keep the engine's C:-only policy; do not relax it for CI.
          $ciTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          if ([IO.Path]::GetPathRoot($ciTemp) -ine 'C:\') {
            $ciTemp = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'Temp'
          }
          $ciTemp = [IO.Path]::GetFullPath($ciTemp)
          if ([IO.Path]::GetPathRoot($ciTemp) -ine 'C:\') {
            throw 'A temporary directory on C: is required; no other drive will be used for test artifacts.'
          }
          $ciRoot = Join-Path $ciTemp ('RETSAR-ci-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $ciRoot | Out-Null
          $ciRoot = (Resolve-Path -LiteralPath $ciRoot).ProviderPath
          if ([IO.Path]::GetPathRoot($ciRoot) -ine 'C:\') { throw 'Unexpected resolved test directory.' }
          foreach ($item in @('src', 'tests', 'lab', 'build.ps1')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $item) -Destination $ciRoot -Recurse
          }
          New-Item -ItemType Directory -Path (Join-Path $ciRoot 'reports') | Out-Null
          "RETSAR_CI_ROOT=$ciRoot" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile core, probe and SDK bridge; run non-interactive tests
        run: |
          $ErrorActionPreference = 'Stop'
          # The CLI suite intentionally invokes commands expected to return 1.
          # Its explicit assertions decide whether those exits are correct.
          $PSNativeCommandUseErrorActionPreference = $false
          $ciLog = Join-Path $env:RETSAR_CI_ROOT 'reports\ci-build-and-tests.log'
          & (Join-Path $env:RETSAR_CI_ROOT 'build.ps1') -Test -Lab -RdsLab 2>&1 | Tee-Object -FilePath $ciLog
          if ($LASTEXITCODE -ne 0) { throw "Build/tests failed: $LASTEXITCODE" }

      - name: Test laboratory supervision with fake Windows calls
        run: |
          $ErrorActionPreference = 'Stop'
          $ciLog = Join-Path $env:RETSAR_CI_ROOT 'reports\ci-build-and-tests.log'
          # Does not launch QEMU, helper processes, guest scripts or native RDS.
          python -B -m unittest discover -s (Join-Path $env:RETSAR_CI_ROOT 'lab') -p test_supervise_qemu.py -v 2>&1 | Tee-Object -FilePath $ciLog -Append
          if ($LASTEXITCODE -ne 0) { throw "Laboratory unit tests failed: $LASTEXITCODE" }

      - name: Parse guest scripts without executing them
        run: |
          $ErrorActionPreference = 'Stop'
          # Parsing never invokes guest gates, Windows APIs, accounts or sessions.
          $scripts = @(Get-ChildItem -LiteralPath (Join-Path $env:RETSAR_CI_ROOT 'lab') -Filter 'guest-*.ps1' -File)
          if ($scripts.Count -eq 0) { throw 'No guest scripts found.' }
          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw "Guest script syntax failed: $($script.Name)" }
            Write-Output "PARSE ONLY $($script.Name); not executed."
          }

      - name: Test guest diagnostic helpers with Windows PowerShell 5.1
        run: |
          $ErrorActionPreference = 'Stop'
          $ciLog = Join-Path $env:RETSAR_CI_ROOT 'reports\ci-build-and-tests.log'
          # Parses the guest script and compiles its declarations; never runs it or invokes WTS.
          $windowsPowerShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RETSAR_CI_ROOT 'tests\guest_session_observer_tests.ps1') 2>&1 | Tee-Object -FilePath $ciLog -Append
          if ($LASTEXITCODE -ne 0) { throw "Observer pure tests failed: $LASTEXITCODE" }
          # The reference checks inspect AST/string values only; no guest script or account action runs.
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RETSAR_CI_ROOT 'tests\guest_rdp_reference_tests.ps1') 2>&1 | Tee-Object -FilePath $ciLog -Append
          if ($LASTEXITCODE -ne 0) { throw "Reference pure tests failed: $LASTEXITCODE" }
          # Extracts pure activation guards only; never runs guest service, registry or ETW actions.
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RETSAR_CI_ROOT 'tests\guest_provider_activation_tests.ps1') 2>&1 | Tee-Object -FilePath $ciLog -Append
          if ($LASTEXITCODE -ne 0) { throw "Activation pure tests failed: $LASTEXITCODE" }
          & $windowsPowerShell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:RETSAR_CI_ROOT 'tests\guest_provider_boot_trace_tests.ps1') 2>&1 | Tee-Object -FilePath $ciLog -Append
          if ($LASTEXITCODE -ne 0) { throw "Boot trace pure tests failed: $LASTEXITCODE" }

      - name: Summarize observed results
        if: always()
        run: |
          '## RETSAR engine preview' | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          'These checks do not create a native Windows seat. A skipped branch is not a pass.' | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($env:RETSAR_CI_ROOT) {
            $ciLog = Join-Path $env:RETSAR_CI_ROOT 'reports\ci-build-and-tests.log'
            if (Test-Path -LiteralPath $ciLog) {
              Get-Content -LiteralPath $ciLog |
                Where-Object { $_ -match '^(TOTAL |CLI TOTAL |PROBE TOTAL |MOCK RDS TOTAL |OBSERVER TOTAL |RDP REFERENCE TOTAL |ACTIVATION TOTAL |BOOT TRACE TOTAL |SKIP |PASS JSON|Ran [0-9]+ tests|OK$)' } |
                ForEach-Object { '- ' + $_ } |
                Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }
